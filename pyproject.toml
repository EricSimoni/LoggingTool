[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intrusion-logger"
version = "0.1.9"
description = "Firewall log collection and IP geolocation tool"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.0",
    "geoip2>=4.0",
    "pyyaml>=6.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
