[loggers]
keys=root,intrusion_logger

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_intrusion_logger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=intrusion_logger
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=simpleFormatter
args=('logs/intrusion_logger.log', 'a', 10485760, 5)

[formatter_simpleFormatter]
format=%(asctime)s : %(name)s : %(levelname)s : %(funcName)s():%(lineno)s : %(message)s
datefmt=%Y-%m-%d %H:%M:%S
